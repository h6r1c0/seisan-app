<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お出かけ精算・案件限定試作</title><style> *{box-sizing:border-box}body{font:17px system-ui,sans-serif;background:#f4f7f6;color:#203b36;margin:0}main{max-width:720px;margin:auto;padding:16px}section{background:white;padding:18px;border-radius:16px;margin:12px 0}h1{font-size:25px}h2{font-size:20px}label{display:block;margin:12px 0 4px}input,select,button,textarea{font:inherit;padding:10px;border:1px solid #aabbb6;border-radius:8px;max-width:100%}input:not([type=checkbox]),select,textarea{width:100%}button{background:#286957;color:white;margin:5px 3px;cursor:pointer}button.secondary{background:white;color:#286957}small{display:block;color:#52665e}pre{white-space:pre-wrap;font:inherit}article{border-top:1px solid #ccc;padding:12px 0}#error{color:#a22}.classIcon{width:36px;height:36px;object-fit:contain;vertical-align:middle;margin-right:5px}button[aria-pressed=true]{background:#286957;color:white}button:disabled{opacity:.45;cursor:default} @media print{body.singlePrint #details article:not(.printChosen){display:none!important}body.singlePrint #details article.printChosen{break-before:auto;page-break-before:auto}body{background:white;color:black}main{max-width:none;padding:0}.screen{display:none!important}section{padding:0;margin:0}article{break-inside:avoid;page-break-inside:avoid}pre{font-size:12pt;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;max-width:100%;margin:0} #details article{break-inside:auto;page-break-inside:auto} #details article+article{break-before:page;page-break-before:always} @page{size:A4;margin:12mm}}</style><main><div class="screen"><h1>お出かけ精算</h1><p>練習専用・架空名簿（実精算には使用しない）</p><section><h2>1. 行事と参加者</h2><label>行事名<input id="title"></label><label>日付<input id="date" type="date"></label><button id="saveEvent">行事を保存</button><div id="people"></div><h3>名簿から追加</h3><div id="classes"></div><div id="roster"></div><h3>ゲスト（今回のみ）</h3><label>子どもの名前<input id="name"></label><label>請求先の世帯名<input id="family" list="families"></label><datalist id="families"></datalist><button id="addPerson">ゲストを追加</button></section><section><h2>2. 費用</h2><div id="expenses"></div><label>費用名<input id="expenseName" list="names"></label><datalist id="names"><option>入場料</option><option>交通費</option><option>駐車場代</option></datalist><label>金額（円）<input id="amount" inputmode="numeric" type="number" min="0" step="1"></label><label>請求方法<select id="mode"><option value="split">子どもで頭割り</option><option value="personal">個人付け</option><option value="finance">財政（団体）へ全額</option></select></label><div id="targets"></div><button id="addExpense">費用を保存</button><button class="secondary" id="cancelEdit">入力をクリア</button></section><p id="error" role="alert">アプリを起動できていません。添付プレビューではなくSafariでWebページとして開いてください。</p><section><h2>3. 保存・明細</h2><p id="status"></p><button id="print">通常明細を印刷</button><small>通常明細を優先しています。集金袋は別途検証中です。</small><button id="export">バックアップ保存</button><label>バックアップを読み込む<input id="import" type="file" accept=".json"></label></section></div><section id="details"></section></main><script>const SettlementCore=(()=>{
 const number=v=>{if(!/^(?:0|[1-9]\d*)(?:\.\d+)?$/.test(String(v)))throw Error('金額・距離の入力が不正です');const n=Number(v);if(!Number.isFinite(n)||n<0)throw Error('数値が不正です');return n};
 const integer=v=>{const n=number(v);if(!Number.isSafeInteger(n))throw Error('整数の円を入力してください');return n};
 const add=values=>values.reduce((s,v)=>s+integer(v),0);
 const halfUp=n=>Math.floor(n+0.5);
 const split=(total,ids)=>{total=integer(total);if(!ids.length)throw Error('対象者がいません');const each=halfUp(total/ids.length);return {per_person_yen:each,individual_sum_yen:each*ids.length,difference_vs_total_yen:each*ids.length-total,persons_yen:Object.fromEntries(ids.map(id=>[id,each]))}};
 const household=members=>{const households={};for(const m of members)households[m.household_id]=(households[m.household_id]||0)+integer(m.amount_yen);return {households_yen:households,all_households_total_yen:add(Object.values(households)),children_total_yen:add(members.map(x=>x.amount_yen))}};
 const group=(base,extra,people)=>{const persons={};for(const p of people)persons[p.person_id]=integer(base)+add(extra.filter(x=>x.group===p.group).map(x=>x.amount_yen_per_person));return {persons_yen:persons,total_yen:add(Object.values(persons))}};
 const gas=(km,rate,ids)=>{const total=halfUp(number(km)*number(rate));const s=split(total,ids);return {gas_total_yen:total,per_person_yen:s.per_person_yen,individual_sum_yen:s.individual_sum_yen,difference_vs_total_yen:s.difference_vs_total_yen,persons_yen:s.persons_yen}};
 const personal=(ids,target,amount)=>{if(!ids.includes(target))throw Error('対象者がいません');const persons=Object.fromEntries(ids.map(id=>[id,id===target?integer(amount):0]));return {persons_yen:persons,total_yen:integer(amount)}};
 const fixedAllocation=(total,ids,charges)=>{total=integer(total);if(!ids.length||new Set(ids).size!==ids.length)throw Error('対象者が不正です');const fixed=Object.fromEntries(ids.map(id=>[id,0]));let included=0,extra=0;for(const c of charges){if(!ids.includes(c.target))throw Error('固定額の対象者が不正です');const n=integer(c.amount);if(c.kind==='included')included+=n;else if(c.kind==='extra')extra+=n;else throw Error('固定額の区分が不正です');fixed[c.target]+=n}if(included>total)throw Error('内数が総額を超えています');const base=split(total-included,ids);const persons=Object.fromEntries(ids.map(id=>[id,base.persons_yen[id]+fixed[id]]));const allocated=add(Object.values(persons));return {persons_yen:persons,total_yen:total+extra,allocated_yen:allocated,difference_vs_total_yen:allocated-total-extra}};
 const fixture=f=>{const x=f.input;if(f.kind==='historical_arithmetic')return {sum_yen:add(x.amounts_yen)};switch(x.operation){case 'split_total':return split(x.total_yen,x.participants);case 'household_aggregate':return household(x.members);case 'group_specific_cost':return group(x.base_yen_per_person,x.extra_costs,x.participants);case 'gasoline':return gas(x.distance_km,x.rate_yen_per_km,x.participants);case 'personal_cost':return personal(x.participants,x.target_person_id,x.amount_yen);default:throw Error('未対応の操作')}};
 const expenses=(people,memberIds,items)=>{const by=Object.fromEntries(people.map(p=>[p.id,[]]));const discrepancies=[];for(const e of items){try{const targets=(e.targets||[]).filter(id=>memberIds.includes(id));if(!targets.length)throw Error('対象者がいません');if(e.mode==='fixed'&&targets.length!==e.targets.length)throw Error('参加者が変更されています。費用を確認してください');const total=e.mode==='gas'?gas(e.km,e.rate,targets).gas_total_yen:integer(e.amount);const result=e.mode==='fixed'?fixedAllocation(total,targets,e.charges||[]):e.mode==='personal'?personal(targets,targets[0],total):split(total,targets);if(e.mode==='personal'&&targets.length!==1)throw Error('個人付けは1人だけ選択してください');for(const id of targets)by[id].push({name:e.name,amount:result.persons_yen[id]});const delta=e.mode==='personal'?0:result.difference_vs_total_yen;if(delta)discrepancies.push({name:e.name,delta,total:result.total_yen??total,allocated:(result.total_yen??total)+delta})}catch(err){discrepancies.push({name:e.name,error:err.message})}}const families=[];for(const family of [...new Set(people.filter(p=>memberIds.includes(p.id)).map(p=>p.family))]){const children=people.filter(p=>memberIds.includes(p.id)&&p.family===family).map(p=>({...p,items:by[p.id],total:add(by[p.id].map(x=>x.amount))}));families.push({family,children,total:add(children.map(c=>c.total))})}return {families,discrepancies}};
 const advanceRefund=(expenses,refunds,expenseId,amount)=>{const e=expenses.find(x=>x.id===expenseId);if(!e)throw Error('元の費用がありません');const n=integer(amount);if(n===0)throw Error('返金額は1円以上');const total=e.mode==='gas'?gas(e.km,e.rate,e.targets).gas_total_yen:e.mode==='fixed'?fixedAllocation(e.amount,e.targets,e.charges||[]).total_yen:integer(e.amount);const cumulative=add(refunds.filter(r=>r.expenseId===expenseId).map(r=>r.amount))+n;return {total,cumulative,warning:cumulative>total}};
 return {add,split,household,group,gas,personal,fixture,expenses,fixedAllocation,advanceRefund};
})();
</script><script>const Outing=(()=>{
 const empty=()=>({title:'',date:'',people:[],expenses:[]});
 const money=x=>{if(!/^\d+$/.test(String(x))||!Number.isSafeInteger(Number(x)))throw Error('金額は0以上の整数で入力してください');return Number(x)};
 function calculate(s){if(!s||typeof s.title!=='string'||typeof s.date!=='string'||!Array.isArray(s.people)||!Array.isArray(s.expenses))throw Error('データ形式が不正です');const ids=s.people.map(p=>p.id);if(new Set(ids).size!==ids.length||s.people.some(p=>typeof p.id!=='string'||!p.id||typeof p.name!=='string'||!p.name.trim()||typeof p.family!=='string'||!p.family.trim()||!['roster','guest'].includes(p.kind)))throw Error('参加者が不正です');if(new Set(s.expenses.map(e=>e.id)).size!==s.expenses.length)throw Error('費用ID重複');const household=[],finance=[];for(const e of s.expenses){if(typeof e.name!=='string'||!e.name.trim()||!['personal','split','finance'].includes(e.mode)||!Array.isArray(e.targets)||new Set(e.targets).size!==e.targets.length||e.targets.some(id=>!ids.includes(id)))throw Error('費用が不正です');const amount=money(e.amount);if(e.mode==='finance'){if(e.targets.length)throw Error('財政と世帯の混在');finance.push({name:e.name,amount});}else{if(!e.targets.length||(e.mode==='personal'&&e.targets.length!==1))throw Error('対象人数が不正です');household.push({...e,amount});}}
 const result=SettlementCore.expenses(s.people,ids,household);if(result.discrepancies.some(d=>d.error))throw Error('計算エラー');const sum=a=>{const n=a.reduce((v,x)=>v+x,0);if(!Number.isSafeInteger(n))throw Error('合計が上限を超えています');return n};const recipients=result.families.map(f=>({kind:'household',name:f.family,total:f.total,lines:f.children.flatMap(c=>c.items.map(i=>({name:c.name+'：'+i.name,amount:i.amount})))}));if(finance.length)recipients.push({kind:'finance',name:'財政（団体）',total:sum(finance.map(i=>i.amount)),lines:finance});const cost=sum(s.expenses.map(e=>money(e.amount))),allocated=sum(recipients.map(r=>r.total));return {recipients,cost,allocated,difference:allocated-cost,discrepancies:result.discrepancies};}
 const yen=n=>n.toLocaleString('ja-JP')+'円';
 const text=(s,r)=>[s.title+' '+s.date,r.name+' 精算明細',...r.lines.map(i=>i.name+' '+yen(i.amount)),'合計 '+yen(r.total)].join('\n');
 return {empty,calculate,text,yen};})();
</script><script>const ROSTER=[{"id":"test-a","name":"練習たろう","family":"練習A家","kind":"roster","group":"学童2年"}];const ICONS={};</script><script>
const $=id=>document.getElementById(id),KEY='outing_practice_only_20261127';let s=Outing.empty(),editing=null,blocked=false,blockReason='';const el=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n};const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);function error(e){$('error').textContent=e.message||String(e)}function commit(next,recovery=false){if(blocked&&!recovery)throw Error(blockReason||'保存データを確認してください');Outing.calculate(next);try{localStorage.setItem(KEY,JSON.stringify(next))}catch(e){throw Error('端末に保存できません。入力は確定していません。Safariの保存設定・空き容量を確認してください。')}s=next;blocked=false;blockReason='';render();$('error').textContent=''}function attempt(fn){try{fn()}catch(e){error(e)}}function eventData(){return {...s,title:$('title').value.trim(),date:$('date').value}}function button(text,fn){const b=el('button',text);b.className='secondary';b.onclick=()=>attempt(fn);return b}function render(){renderRoster(); $('title').value=s.title;$('date').value=s.date;$('people').replaceChildren();for(const p of s.people){const a=el('article',p.name+' ／ '+p.family+' ／ '+(p.kind==='guest'?'ゲスト':'名簿参加者'));if(p.group)a.prepend(iconFor(p.group));a.append(button('削除',()=>{if(s.expenses.some(e=>e.targets.includes(p.id)))throw Error('先に関連費用を変更してください');if(confirm('参加者を削除しますか？'))commit({...eventData(),people:s.people.filter(x=>x.id!==p.id)})}));$('people').append(a)}$('expenses').replaceChildren();for(const e of s.expenses){const a=el('article',e.name+' '+Outing.yen(Number(e.amount))+' ／ '+(e.mode==='finance'?'財政':e.targets.map(id=>s.people.find(p=>p.id===id).name).join('・')));a.append(button('編集',()=>{editing=e.id;$('expenseName').value=e.name;$('amount').value=e.amount;$('mode').value=e.mode;targets(e.targets)}),button('削除',()=>{if(confirm('費用を削除しますか？')){commit({...eventData(),expenses:s.expenses.filter(x=>x.id!==e.id)});clearExpense()}}));$('expenses').append(a)}targets(s.people.map(p=>p.id));const c=Outing.calculate(s);$('status').textContent='費用 '+Outing.yen(c.cost)+' ／ 請求合計 '+Outing.yen(c.allocated)+(c.difference?' ／ 四捨五入差 '+Outing.yen(c.difference)+'（未調整）':'');$('details').replaceChildren(el('h2','精算明細'));for(const r of c.recipients){const a=el('article','');const t=Outing.text(s,r);a.append(el('pre',t));const pb=button('この明細だけ印刷',()=>{if(blocked)throw Error(blockReason||'保存データを確認してください');document.body.classList.add('singlePrint');a.classList.add('printChosen');try{window.print()}finally{a.classList.remove('printChosen');document.body.classList.remove('singlePrint')}});pb.classList.add('screen');a.append(pb);const b=button('LINE用コピー',async()=>{try{await navigator.clipboard.writeText(t);b.textContent='コピー済み'}catch{let ta=a.querySelector('textarea');if(!ta){ta=el('textarea','');ta.className='screen';ta.readOnly=true;ta.setAttribute('aria-label','LINE用明細');ta.value=t;ta.rows=8;a.append(ta)}ta.focus();ta.select();error(Error('自動コピーできません。表示された文面をコピーしてください'))}});b.classList.add('screen');a.append(b);$('details').append(a)}}let group='学童2年';function iconFor(g){const i=document.createElement('img');i.hidden=true;i.alt='';i.className='classIcon';return i}function renderRoster(){ $('classes').replaceChildren();for(const g of ['きんぎょ','めだか','あひる','とんぼ','つばめ','かもしか','学童2年','学童3年','学童5年']){const b=button(g,()=>{group=g;renderRoster()});b.prepend(iconFor(g));b.setAttribute('aria-pressed',String(g===group));$('classes').append(b)}$('roster').replaceChildren();for(const p of ROSTER.filter(p=>p.group===group)){const b=button(p.name,()=>commit({...eventData(),people:[...s.people,{...p}]}));b.disabled=s.people.some(x=>x.id===p.id);$('roster').append(b)}$('families').replaceChildren();for(const f of new Set(ROSTER.map(p=>p.family))){const o=document.createElement('option');o.value=f;$('families').append(o)}}function targets(selected){$('targets').replaceChildren();if($('mode').value==='finance')return;for(const p of s.people){const l=el('label',''),i=document.createElement('input');i.type=$('mode').value==='personal'?'radio':'checkbox';i.name='target';i.value=p.id;i.checked=selected.includes(p.id)&&($('mode').value!=='personal'||selected[0]===p.id);l.append(i,document.createTextNode(' '+p.name));$('targets').append(l)}}function clearExpense(){editing=null;$('expenseName').value='';$('amount').value='';$('mode').value='split';targets(s.people.map(p=>p.id))} $('mode').onchange=()=>targets(s.people.map(p=>p.id));$('saveEvent').onclick=()=>attempt(()=>commit(eventData()));$('addPerson').onclick=()=>attempt(()=>{commit({...eventData(),people:[...s.people,{id:uid(),name:$('name').value.trim(),family:$('family').value.trim(),kind:'guest'}]});$('name').value='';$('family').value=''});$('addExpense').onclick=()=>attempt(()=>{const e={id:editing||uid(),name:$('expenseName').value.trim(),amount:$('amount').value,mode:$('mode').value,targets:[...$('targets').querySelectorAll('input:checked')].map(i=>i.value)};commit({...eventData(),expenses:editing?s.expenses.map(x=>x.id===editing?e:x):[...s.expenses,e]});clearExpense()});$('cancelEdit').onclick=clearExpense;$('print').onclick=()=>attempt(()=>{if(blocked)throw Error(blockReason||'保存データを確認してください');if(!Outing.calculate(s).recipients.length)throw Error('印刷する明細がありません');window.print()});$('export').onclick=()=>attempt(()=>{if(blocked)throw Error(blockReason||'保存データを確認してください');const u=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));const a=el('a','');a.href=u;a.download='outing-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});$('import').onchange=async()=>{try{const f=$('import').files[0];if(!f)return;const next=JSON.parse(await f.text());Outing.calculate(next);if(confirm('現在の案件を読み込んだ内容に置き換えますか？')){commit(next,true);clearExpense()}}catch(e){error(e)}finally{$('import').value=''}};let raw;try{raw=localStorage.getItem(KEY);localStorage.setItem(KEY+'__probe','1');localStorage.removeItem(KEY+'__probe')}catch(e){blocked=true;blockReason='この画面では端末への保存が使えません。添付プレビューを閉じ、SafariでWebページとして開いてください。保存・印刷は停止しています。';error(Error(blockReason))}if(!blocked){try{if(raw){const next=JSON.parse(raw);Outing.calculate(next);s=next}}catch(e){blocked=true;blockReason='保存済みデータを読み取れません。元のデータは上書きしていません。正常なバックアップを読み込んでください。';error(Error(blockReason))}}if(!blocked){try{render();$('error').textContent=''}catch(e){blocked=true;blockReason='画面の初期化に失敗しました。保存・印刷を停止しました。担当者に連絡してください。';error(Error(blockReason))}}
</script></html>
